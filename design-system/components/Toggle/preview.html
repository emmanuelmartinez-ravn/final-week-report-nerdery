<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Toggle</title><style>.g{display:grid;gap:24px 32px;padding:24px;align-items:start}.g{grid-template-columns:repeat(3,1fr)}</style></head>
<body>
<div class="g">
<div><p class="rj-state">off</p><label class="rj-toggle"><input type="checkbox" role="switch"> Dark mode</label></div>
<div><p class="rj-state">on · hover</p><label class="rj-toggle is-hover"><input type="checkbox" role="switch" checked> Dark mode</label></div>
<div><p class="rj-state">focus</p><label class="rj-toggle is-focus"><input type="checkbox" role="switch" checked> Dark mode</label></div>
<div><p class="rj-state">disabled off</p><label class="rj-toggle"><input type="checkbox" role="switch" disabled> Email digests</label></div>
<div><p class="rj-state">disabled on</p><label class="rj-toggle"><input type="checkbox" role="switch" checked disabled> Email digests</label></div>
</div>
</body>
</html>
