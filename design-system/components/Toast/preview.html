<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Toast</title></head>
<body>
<div class="rj-pad rj-stack" style="align-items:flex-start">
<div class="rj-toast" role="status"><svg class="rj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /> <path d="m16 9-5.5 5.5L8 12" /></svg><p>Entry published to your timeline.</p><button class="rj-toast-close" aria-label="Dismiss"><svg class="rj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg></button></div>
<div class="rj-toast" role="status"><svg class="rj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /> <path d="M12 16v-4" /> <path d="M12 8h.01" /></svg><p>Link copied.</p><a class="rj-btn rj-btn-sm" style="color:var(--text-inverse);text-decoration:underline" href="#">Undo</a></div>
</div>
</body>
</html>
