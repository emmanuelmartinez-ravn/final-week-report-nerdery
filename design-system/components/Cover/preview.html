<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RAVN Learning Journal</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg-canvas); color:var(--text-primary); font-family:var(--font-body); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .band { position:absolute; top:0; left:0; width:960px; height:112px; }
  .band svg { display:block; }
  .ink { fill:var(--bg-inverse); }
  .teal { fill:var(--accent); }
  .tint { fill:var(--primary-200); }
  .slate { fill:var(--secondary-600); }
  .dot { fill:var(--primary-700); }
  .blk { rx:var(--radius-lg); }
  .words { position:absolute; left:var(--space-6); right:var(--space-6); bottom:var(--space-6); }
  .name { margin:0; font-family:var(--font-display); font-size:64px; line-height:.95; font-weight:600; letter-spacing:-.025em; color:var(--text-primary); white-space:nowrap; }
  .tag { margin:var(--space-2) 0 0 2px; font-size:14px; line-height:20px; color:var(--text-secondary); }
</style>
</head>
<body>
<div class="cover">
<div class="band" aria-hidden="true">
<svg viewBox="0 0 960 112" width="960" height="112">
<!--
  blocks      bg-inverse (RAVN ink) 264x124 · accent (teal) 176 · primary-200 tint 304 · secondary-600 (slate) 160 bleeding off the right — all bled off the top, ~37% of 960x288
  arrangement top-band skeleton (the name is too wide for the 440px zone): a strip of unequal bands, space-4 gutters, ink first and widest-but-one
  pattern     dot grid — "a notebook kept on a 4px grid": 40 dots at a space-4 pitch, primary-700 on the tint, like dot-grid paper
  scales      gutters space-4 (16); pitch space-4; corners radius-lg (12); band 112 = space-24 + space-4
-->
<rect class="ink blk" x="24" y="-12" width="264" height="124" rx="12"/>
<rect class="teal blk" x="304" y="-12" width="176" height="124" rx="12"/>
<rect class="tint blk" x="496" y="-12" width="304" height="124" rx="12"/>
<rect class="slate blk" x="816" y="-12" width="160" height="124" rx="12"/>
<circle class="dot" cx="656" cy="24" r="2.5"/>
