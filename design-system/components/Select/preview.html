<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Select</title><style>.g{display:grid;gap:24px 32px;padding:24px;align-items:start}.g{grid-template-columns:repeat(3,1fr)}</style></head>
<body>
<div class="g">
<div><p class="rj-state">default</p><div class="rj-field"><label class="rj-label" for="s1">Module</label><div class="rj-select-wrap"><select class="rj-select" id="s1"><option>All modules</option><option>React</option></select><svg class="rj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></div></div></div>
<div><p class="rj-state">hover</p><div class="rj-field"><label class="rj-label" for="s2">Module</label><div class="rj-select-wrap"><select class="rj-select is-hover" id="s2"><option>React</option></select><svg class="rj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></div></div></div>
<div><p class="rj-state">focus + open menu</p><div class="rj-field"><label class="rj-label" for="s3">Module</label><div class="rj-select-wrap"><select class="rj-select is-focus" id="s3"><option>GraphQL</option></select><svg class="rj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></div><ul class="rj-menu" role="listbox"><li>React</li><li class="is-hover">Node.js &amp; APIs</li><li aria-selected="true">GraphQL <svg class="rj-icon rj-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></li><li>Testing</li></ul></div></div>
<div><p class="rj-state">disabled</p><div class="rj-field"><label class="rj-label" for="s4">Cohort</label><div class="rj-select-wrap"><select class="rj-select" id="s4" disabled><option>2026</option></select><svg class="rj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></div></div></div>
<div><p class="rj-state">error</p><div class="rj-field"><label class="rj-label" for="s5">Mentor</label><div class="rj-select-wrap"><select class="rj-select" id="s5" aria-invalid="true" aria-describedby="s5e"><option>Choose a mentor</option></select><svg class="rj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></div><p class="rj-error-msg" id="s5e"><svg class="rj-icon rj-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /> <path d="m15 9-6 6" /> <path d="m9 9 6 6" /></svg> Choose who reviewed this entry</p></div></div>
</div>
</body>
</html>
