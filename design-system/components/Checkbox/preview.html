<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Checkbox</title><style>.g{display:grid;gap:24px 32px;padding:24px;align-items:start}.g{grid-template-columns:repeat(3,1fr)}</style></head>
<body>
<div class="g">
<div><p class="rj-state">default</p><label class="rj-check"><input type="checkbox"> Show mentor feedback</label></div>
<div><p class="rj-state">checked · hover</p><label class="rj-check is-hover"><input type="checkbox" checked> Show mentor feedback</label></div>
<div><p class="rj-state">focus</p><label class="rj-check is-focus"><input type="checkbox" checked> Show mentor feedback</label></div>
<div><p class="rj-state">disabled</p><label class="rj-check"><input type="checkbox" checked disabled> Include archived weeks</label></div>
<div><p class="rj-state">error</p><div class="rj-stack" style="gap:4px"><label class="rj-check"><input type="checkbox" aria-invalid="true" aria-describedby="ce"> I reviewed this entry</label><p class="rj-error-msg" id="ce"><svg class="rj-icon rj-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /> <path d="m15 9-6 6" /> <path d="m9 9 6 6" /></svg> Confirm before publishing</p></div></div>
<div><p class="rj-state">radio group</p><fieldset style="border:0;margin:0;padding:0" class="rj-stack"><legend class="rj-label" style="margin-bottom:8px">Sort entries</legend><label class="rj-check"><input type="radio" name="r" checked> Newest first</label><label class="rj-check"><input type="radio" name="r"> Oldest first</label></fieldset></div>
</div>
</body>
</html>
