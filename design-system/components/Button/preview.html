<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button</title><style>.g{display:grid;gap:24px 32px;padding:24px;align-items:start}.g{grid-template-columns:100px repeat(4,max-content)}</style></head>
<body>
<div class="g">
<p class="rj-eyebrow" style="align-self:center">Primary</p>
<div><p class="rj-state">default</p><button class="rj-btn rj-btn-primary">Publish entry</button></div>
<div><p class="rj-state">hover</p><button class="rj-btn rj-btn-primary is-hover">Publish entry</button></div>
<div><p class="rj-state">focus</p><button class="rj-btn rj-btn-primary is-focus">Publish entry</button></div>
<div><p class="rj-state">disabled</p><button class="rj-btn rj-btn-primary" disabled>Publish entry</button></div><p class="rj-eyebrow" style="align-self:center">Secondary</p>
<div><p class="rj-state">default</p><button class="rj-btn rj-btn-secondary">Save draft</button></div>
<div><p class="rj-state">hover</p><button class="rj-btn rj-btn-secondary is-hover">Save draft</button></div>
<div><p class="rj-state">focus</p><button class="rj-btn rj-btn-secondary is-focus">Save draft</button></div>
<div><p class="rj-state">disabled</p><button class="rj-btn rj-btn-secondary" disabled>Save draft</button></div><p class="rj-eyebrow" style="align-self:center">Ghost</p>
<div><p class="rj-state">default</p><button class="rj-btn rj-btn-ghost">View project</button></div>
<div><p class="rj-state">hover</p><button class="rj-btn rj-btn-ghost is-hover">View project</button></div>
<div><p class="rj-state">focus</p><button class="rj-btn rj-btn-ghost is-focus">View project</button></div>
<div><p class="rj-state">disabled</p><button class="rj-btn rj-btn-ghost" disabled>View project</button></div><p class="rj-eyebrow" style="align-self:center">Danger</p>
<div><p class="rj-state">default</p><button class="rj-btn rj-btn-danger">Delete entry</button></div>
<div><p class="rj-state">hover</p><button class="rj-btn rj-btn-danger is-hover">Delete entry</button></div>
<div><p class="rj-state">focus</p><button class="rj-btn rj-btn-danger is-focus">Delete entry</button></div>
<div><p class="rj-state">disabled</p><button class="rj-btn rj-btn-danger" disabled>Delete entry</button></div>
<p class="rj-eyebrow" style="align-self:center">Sizes</p>
<div class="rj-row" style="grid-column:span 4"><button class="rj-btn rj-btn-primary rj-btn-sm">Small</button><button class="rj-btn rj-btn-primary">Medium</button><button class="rj-btn rj-btn-primary rj-btn-lg">Large <svg class="rj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" /> <path d="m12 5 7 7-7 7" /></svg></button><button class="rj-btn rj-btn-secondary rj-btn-icon" aria-label="Search"><svg class="rj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34" /> <circle cx="11" cy="11" r="8" /></svg></button></div>
</div>
</body>
</html>
